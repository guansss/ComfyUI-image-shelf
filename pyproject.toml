[project]
name = "comfyui-image-shelf"
description = "Browse, search, and manage generated images from within ComfyUI."
version = "0.1.0"
license = {file = "LICENSE"}
dependencies = [
	"aiohttp",
	"Pillow",
	"python-dotenv",
	"watchdog",
]

[project.urls]
Repository = "https://github.com/guansss/ComfyUI-image-shelf"

# Used by Comfy Registry https://comfyregistry.org
[tool.comfy]
PublisherId = "guansss"
DisplayName = "ComfyUI Image Shelf"
Icon = ""
includes = ["dist/"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["image_shelf*"]